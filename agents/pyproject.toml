[project]
name = "cairn-agents"
version = "0.1.0"
description = "Cairn agents (LangGraph + A2A). Python is the secondary language; numeric work stays in Rust MCP tools."
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = []

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.8"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cairn_agents"]
