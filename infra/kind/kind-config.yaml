# Local Cairn cluster. Keep OrbStack/Docker memory <= ~10GB so host-side LLM (Ollama/Metal) has room.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: cairn
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30080   # AgentGateway (NodePort) -> localhost:8080
        hostPort: 8080
        protocol: TCP
  - role: worker
  - role: worker
