# Stock OpenAI-compatible chat UI (Phase 1). Replaced by the Rust/Leptos UI in Phase 3.
# All model traffic goes UI -> AgentGateway (/llm) -> Ollama; the UI never talks to Ollama directly.
apiVersion: v1
kind: Namespace
metadata:
  name: cairn
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: open-webui-data
  namespace: cairn
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: open-webui
  namespace: cairn
spec:
  replicas: 1
  strategy:
    type: Recreate   # single RWO volume
  selector:
    matchLabels: { app: open-webui }
  template:
    metadata:
      labels: { app: open-webui }
    spec:
      containers:
        - name: open-webui
          image: ghcr.io/open-webui/open-webui:v0.12.0
          ports:
            - containerPort: 8080
          env:
            - name: OPENAI_API_BASE_URL
              value: http://agentgateway-proxy.agentgateway-system.svc.cluster.local/llm
            - name: OPENAI_API_KEY
              value: unused-gateway-has-no-auth-yet
            - name: ENABLE_OLLAMA_API
              value: "false"
            - name: ENABLE_SIGNUP
              value: "true"        # first account becomes admin; flip to false after you sign up
            - name: ANONYMIZED_TELEMETRY
              value: "false"
            - name: SCARF_NO_ANALYTICS
              value: "true"
            - name: DO_NOT_TRACK
              value: "true"
            - name: WEBUI_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: open-webui-secret   # created by `make ui`, never committed
                  key: key
          volumeMounts:
            - name: data
              mountPath: /app/backend/data
          resources:
            requests: { cpu: 100m, memory: 512Mi }
            limits: { memory: 2Gi }
          readinessProbe:
            httpGet: { path: /health, port: 8080 }
            initialDelaySeconds: 20
            periodSeconds: 10
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: open-webui-data
---
apiVersion: v1
kind: Service
metadata:
  name: open-webui
  namespace: cairn
spec:
  selector: { app: open-webui }
  ports:
    - port: 80
      targetPort: 8080
