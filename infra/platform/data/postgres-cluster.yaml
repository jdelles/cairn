# Source of truth for accounts, transactions, holdings. Operator-managed (CloudNativePG).
# Credentials are generated by the operator into secret `cairn-db-app` (cluster-only, never in git).
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: cairn-db
  namespace: cairn
spec:
  instances: 1          # single node for the local lab; raise for HA elsewhere
  storage:
    size: 5Gi
  bootstrap:
    initdb:
      database: cairn
      owner: cairn
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { memory: 1Gi }
